function update(){
tick++;
if(puz.lt>0)puz.lt--;
updFx();growBlobs();
if(maskDirty&&mode!=="title")rebuildMask();
if(tick%90===0)checkTime();
dstep();
var h=held();if(h!==prevH){if(h>=0)onDir(h);prevH=h}
if(fade){
if(fade.ph===0){fade.v+=.1;if(fade.v>=1){fade.v=1;fade.ph=1;setMap(fade.m,fade.tx,fade.ty,fade.dir)}}
else{fade.v-=.1;if(fade.v<=0){fade=null;arrive()}}
return}
if(mode==="term")termStep();
if(mode==="sky"){var sp=1.7;if(h===0)sky.cy-=sp;else if(h===2)sky.cy+=sp;else if(h===1)sky.cx-=sp;else if(h===3)sky.cx+=sp;sky.cx=Math.max(4,Math.min(156,sky.cx));sky.cy=Math.max(16,Math.min(140,sky.cy));return}
if(mode!=="play"||D.active)return;
var spd=BH?2:1;
okanFollow(spd);
if(P.moving){
P.prog+=spd;
if(P.prog>=T){P.tx+=DX[P.dir];P.ty+=DY[P.dir];P.moving=false;P.prog=0;sfx("step");P.turn=0;
H.unshift({x:P.tx,y:P.ty});H.length=3;
if(terrC(P.tx,P.ty)==="X"){go(2,7,6,1);return}
save();
if(h>=0&&h===P.dir&&!blocked(P.tx+DX[h],P.ty+DY[h]))P.moving=true}
return}
if(h>=0){
if(P.dir!==h){P.dir=h;P.turn=4;return}
if(P.turn>0){P.turn--;return}
var nx=P.tx+DX[h],ny=P.ty+DY[h];
if(nx<0||nx>=COLS){tryExit(h);return}
if(!blocked(nx,ny)){P.moving=true;P.prog=0}else if(tick%24===0)sfx("bump")
}else if(P.turn>0)P.turn=0}
function blocked(x,y){if(x<0||x>=COLS)return true;return solid(x,y)}
function tryExit(h){
var e=null;EXITS.forEach(function(q){if(q.m===S.map&&q.side===h&&q.y===P.ty)e=q});
if(!e)return;
if(e.gate&&!FREE&&S.done.length<9){if(tick%40===0){sfx("no");say(["Jalan ke timur masih gelap.","Selesaikan semua misi dulu."])}return}
go(e.to,e.tx,e.ty,h)}
function okanFollow(spd){
if(F.okanAway)return;
var t=H[1]||H[0],tx=t.x*T,ty=t.y*T,dx=tx-OK.px,dy=ty-OK.py,d=Math.abs(dx)+Math.abs(dy);
if(d>T*3){OK.px=tx;OK.py=ty;return}
if(d===0){OK.mv=0;return}
var s=Math.min(spd,d);
if(Math.abs(dx)>=Math.abs(dy)&&dx!==0){OK.px+=Math.sign(dx)*Math.min(s,Math.abs(dx));OK.dir=dx<0?1:3}
else if(dy!==0){OK.py+=Math.sign(dy)*Math.min(s,Math.abs(dy));OK.dir=dy<0?0:2}
OK.mv++}

function scene(){

var m=MAPS[S.map];

var zf=P.moving?((P.prog>>2)&3):0;
list.push({y:zy+8,f:function(){pl(zx,zy-2,P.dir,zf,0)}});

list.sort(function(a,b){return a.y-b.y});

fx.forEach(function(e){px(e.x,e.y,e.c)});
if(m.id==="malam"&&mode!=="title"&&rivDone(2)<3&&!FREEdark){var rad=34+(inv("lentera")||F.g_lentera?14:0)+ffN()*16;night(zx+8,zy+8,rad)}
EXITS.forEach(function(q){if(q.m!==S.map||((tick>>5)&1))return;var e=q.side===3,X=e?COLS*T-8:3,Y=q.y*T+3,k;for(k=0;k<6;k++){R(e?X-1+k:X+6-k,Y-1+k,1,11-2*k,0)}for(k=0;k<5;k++){R(e?X+k:X+5-k,Y+k,1,9-2*k,3)}});

drawHud();

function night(cxp,cyp,rad){

var dd=Math.sqrt((x-cxp)*(x-cxp)+(y-cyp)*(y-cyp)),a=0;
if(dd>rad+16){if((x+y)&1)a=1}else if(dd>rad){if((x&1)&&(y&1))a=1}
if(a){var i=(y*160+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255}}

function targets(i){
if(i===0){if(inv("airember"))return[[8,7]];if(inv("ember"))return[[7,2]];if(!F.g_ember)return[[2,3]];return[[7,2]]}
if(i===1){return inv("umpan")?[[1,5]]:[[8,4]]}
if(i===2){if(inv("layangan"))return[[4,3]];if(!F.child)return[[4,3]];if(!F.kiteDown)return inv("galah")?[[3,7]]:[[2,8]];return[[4,3]]}
if(i===3){if(inv("papan")){for(var k=0;k<3;k++)if(!F["br"+k])return[[4+k,4]]}var l=[];[[1,2],[3,6],[2,8]].forEach(function(p,j){if(!F["gp"+j])l.push(p)});return l}
if(i===4){if(!F.pel)return[[1,5]];var l2=[];if(!F.g_bm)l2.push([2,1]);if(!F.g_by)l2.push([0,6]);if(!F.g_bb)l2.push([3,3]);if(!l2.length)return[[1,5]];return l2}

if(i===6){if(!F.g_lentera)return[[2,2]];var l3=[];FFP.forEach(function(p,j){if(!F["ff"+j])l3.push(p)});return l3}

}
